<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="UTF-8">
    <meta property="og:title" content="Pokeless: λ plays pokemon" />
    <meta property="og:image" content="https://pokeless.rauchg.now.sh/run.js" />
    <meta property="og:url" content="https://pokeless.rauchg.now.sh" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { background: yellow; }
      div { display: flex; align-items: center; justify-content: center; flex-direction: column; height: 80vh; width: 100vw; }
      img { width: 500px; max-width: 100vw; margin: auto; border: 8px solid #000; }
      h1, nav { padding: 30px 10px; }
      nav { text-align: center; }
      h1 { font-family: helvetica; text-align: center; }
      button { font-size: 16px; background: #000; color: #fff; margin: 1px; width: 80px; font-weight: bold; vertical-align: middle; line-height: 30px; height: 30px; border: none; }
      button.active { background: red; }
    </style>
  </head>
  <body>
    <div>
      <h1>Pokeless: λ plays pokemon</h1>
      <img src="/api/run" />
      <nav>
        <button value="4">A</button>
        <button value="5">B</button>
        <button value="2">↑</button>
        <button value="7">START</button>
        <button value="6">SEL</button>
        <button value="1">←</button>
        <button value="3">↓</button>
        <button value="0">→</button>
      </nav>
    </div>

    <script>
      const img = document.querySelector('img');
      let paused = false;

      // Key mapping
      const keyMap = {
        'ArrowRight': 0,
        'ArrowLeft': 1,
        'ArrowUp': 2,
        'ArrowDown': 3,
        'a': 4,
        'b': 5,
        'Enter': 6,
        ' ': 7
      };

      // Handle key press
      function pressKey(key) {
        setActiveButton(key);
        fetch('/api/key', {
          method: 'POST',
          body: key.toString()
        }).catch(err => {
          console.error('Error pressing key:', err);
        });
      }

      // Handle key release
      function releaseKey() {
        setActiveButton(null);
      }

      // Update active button UI
      function setActiveButton(key) {
        // Remove active class from all buttons
        document.querySelectorAll('button.active').forEach(btn => {
          btn.classList.remove('active');
        });

        // Add active class to pressed button
        if (key !== null) {
          const btn = document.querySelector(`button[value="${key}"]`);
          if (btn) btn.classList.add('active');
        }
      }

      // Sequential frame updates
      async function refresh() {
        if (paused) return;
        
        try {
          const res = await fetch('/api/run');
          const blob = await res.blob();
          img.src = URL.createObjectURL(blob);
          // Queue next frame only after this one loads
          refresh();
        } catch (err) {
          console.error('Error fetching frame:', err);
          // On error, wait a bit before retrying
          setTimeout(refresh, 1000);
        }
      }

      // Key event handlers
      window.addEventListener('keydown', (e) => {
        if (e.repeat) return;
        const key = keyMap[e.key.toLowerCase()];
        if (key !== undefined) {
          e.preventDefault();
          pressKey(key);
        }
      });

      window.addEventListener('keyup', (e) => {
        const key = keyMap[e.key.toLowerCase()];
        if (key !== undefined) {
          e.preventDefault();
          releaseKey();
        }
      });

      // Button event handlers
      document.addEventListener('mousedown', (e) => {
        if (e.target.nodeName === 'BUTTON') {
          e.preventDefault();
          pressKey(e.target.value);
        }
      });

      document.addEventListener('mouseup', (e) => {
        if (e.target.nodeName === 'BUTTON') {
          e.preventDefault();
          releaseKey();
        }
      });

      // Touch event handlers
      document.addEventListener('touchstart', (e) => {
        if (e.target.nodeName === 'BUTTON') {
          e.preventDefault();
          pressKey(e.target.value);
        }
      });

      document.addEventListener('touchend', (e) => {
        if (e.target.nodeName === 'BUTTON') {
          e.preventDefault();
          releaseKey();
        }
      });

      // Visibility handling
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          paused = true;
          releaseKey();
        } else {
          paused = false;
          refresh();
        }
      });

      // Start the stream
      refresh();
    </script>
  </body>
</html>
