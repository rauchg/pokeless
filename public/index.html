<!doctype html>
<html>

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700" rel="stylesheet" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="UTF-8" />
  <meta property="og:title" content="Fluid plays Pokémon" />
  <meta property="og:url" content="https://fpp.vercel.app" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Pixelify Sans";
      font-optical-sizing: auto;
    }

    html {
      background: #000;
      color: #fff;
    }

    main {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    canvas {
      width: 500px;
      max-width: 100vw;
      margin: 0 auto;
      border: 8px solid #222;
      transition: opacity 0.3s ease-in-out;
    }

    canvas.reconnecting {
      opacity: 0.5;
    }

    #key-info {
      height: 20px;
      font-size: 14px;
      margin: 10px 0;
      opacity: 0;
      transition: opacity 0.2s ease-out;
      text-align: center;
    }

    #key-info.visible {
      opacity: 1;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    nav {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    #main-nav {
      display: flex;
      gap: 40px;
      align-items: center;
    }

    button {
      font-size: 16px;
      background: #000;
      color: #fff;
      margin: 1px;
      width: 80px;
      font-weight: bold;
      vertical-align: middle;
      line-height: 40px;
      height: 40px;
      border: 1px solid #333;
      cursor: pointer;
    }

    @media (hover: hover) {
      button:hover {
        border-color: #666;
      }
    }

    button.active {
      background: #fff;
      color: #000;
    }

    #buttons {
      display: flex;
      gap: 5px;
    }

    #misc button {
      height: 26px;
      line-height: 26px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      button {
        width: 60px;
        height: 45px;
        line-height: 45px;
        font-size: 16px;
      }

      #buttons button {
        height: 45px;
        line-height: 45px;
      }

      #misc button {
        height: 35px;
        line-height: 35px;
        padding: 0 15px;
        width: auto;
      }

      #main-nav {
        gap: 20px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Fluid plays pokemon</h1>
    <canvas width="320" height="288"></canvas>
    <div id="key-info"></div>
    <nav>
      <div id="main-nav">
        <div id="dpad">
          <div>
            <button value="2">↑</button>
          </div>
          <button value="1">←</button>
          <button value="3">↓</button>
          <button value="0">→</button>
        </div>

        <div id="buttons">
          <button value="4">A</button>
          <button value="5">B</button>
        </div>
      </div>

      <div id="misc">
        <button value="7">START</button>
        <button value="6">SEL</button>
      </div>
    </nav>
  </main>

  <script>
    const canvas = document.querySelector("canvas");
    const ctx = canvas.getContext("2d");
    const keyInfo = document.querySelector("#key-info");
    let lastFrameTime = Date.now();
    let currentStream = null;
    let keyInfoTimeout;

    // Key name mapping
    const keyNames = {
      0: "→",
      1: "←",
      2: "↑",
      3: "↓",
      4: "A",
      5: "B",
      6: "SEL",
      7: "START",
    };

    // Key mapping
    const keyMap = {
      ArrowRight: "0",
      ArrowLeft: "1",
      ArrowUp: "2",
      ArrowDown: "3",
      a: "4",
      b: "5",
      Enter: "6",
      " ": "7",
      Right: "0", // IE/Edge compatibility
      Left: "1", // IE/Edge compatibility
      Up: "2", // IE/Edge compatibility
      Down: "3", // IE/Edge compatibility
    };

    let pendingKeyRequest = false;

    // Handle key press
    async function pressKey(key) {
      if (pendingKeyRequest) return;

      pendingKeyRequest = true;
      setActiveButton(key);

      try {
        await fetch("/api/key", {
          method: "POST",
          body: key,
        });
      } catch (err) {
        console.error("Error pressing key:", err);
      } finally {
        pendingKeyRequest = false;
        setActiveButton(null);
      }
    }

    // Handle key release
    function releaseKey() {
      setActiveButton(null);
    }

    // Update active button UI
    function setActiveButton(key) {
      // Remove active class from all buttons
      document.querySelectorAll("button.active").forEach((btn) => {
        btn.classList.remove("active");
      });

      // Add active class to pressed button
      if (key !== null) {
        const btn = document.querySelector(`button[value="${key}"]`);
        if (btn) btn.classList.add("active");
      }
    }

    // Stream frames
    let retryCount = 0;
    const MAX_RETRY_DELAY = 5000; // max 5 second delay

    async function startStream() {
      if (document.hidden) return;

      // Add reconnecting class before starting new stream
      if (Date.now() - lastFrameTime > 1000) {
        canvas.classList.add("reconnecting");
      }

      try {
        const response = await fetch("/api/run");
        const reader = response.body.getReader();
        let buffer = new Uint8Array();

        // Store current stream
        currentStream = {reader, response};

        // Reset retry count and fade state on successful connection
        retryCount = 0;
        canvas.classList.remove("reconnecting");

        while (true) {
          const {value, done} = await reader.read();
          if (done) break;

          // Append new data to buffer
          const newBuffer = new Uint8Array(buffer.length + value.length);
          newBuffer.set(buffer);
          newBuffer.set(value, buffer.length);
          buffer = newBuffer;

          // Look for frame boundaries
          let frameStart = 0;
          while (true) {
            // Find start of PNG data
            const pngStart = findSequence(
              buffer,
              [0x89, 0x50, 0x4e, 0x47],
              frameStart,
            );
            if (pngStart === -1) break;

            // Find end of PNG data (IEND chunk)
            const pngEnd = findSequence(
              buffer,
              [0x49, 0x45, 0x4e, 0x44, 0xae, 0x42, 0x60, 0x82],
              pngStart,
            );
            if (pngEnd === -1) break;

            // Extract PNG data
            const pngData = buffer.slice(pngStart, pngEnd + 8);

            // Create and display image
            const blob = new Blob([pngData], {type: "image/png"});
            const img = new Image();
            img.onload = () => {
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              URL.revokeObjectURL(img.src);
              lastFrameTime = Date.now();
              canvas.classList.remove("reconnecting");
            };
            img.src = URL.createObjectURL(blob);

            // Move past PNG
            frameStart = pngEnd + 8;

            // Look for JSON frame
            const jsonFrameStart = findSequence(
              buffer,
              [0x2d, 0x2d, 0x66, 0x72, 0x61, 0x6d, 0x65, 0x0d, 0x0a], // "--frame\r\n"
              frameStart,
            );

            if (jsonFrameStart !== -1) {
              // Find double CRLF that separates headers from content
              const contentStart = findSequence(
                buffer,
                [0x0d, 0x0a, 0x0d, 0x0a], // "\r\n\r\n"
                jsonFrameStart,
              );

              if (contentStart !== -1) {
                // Find next frame boundary or end of data
                const nextFrame = findSequence(
                  buffer,
                  [0x0d, 0x0a, 0x2d, 0x2d], // "\r\n--"
                  contentStart + 4,
                );

                // Get headers to check content type
                const headers = new TextDecoder().decode(
                  buffer.slice(jsonFrameStart, contentStart),
                );

                if (headers.includes("Content-Type: application/json")) {
                  // Extract JSON content
                  const jsonEnd =
                    nextFrame !== -1 ? nextFrame : buffer.length;
                  const jsonContent = new TextDecoder().decode(
                    buffer.slice(contentStart + 4, jsonEnd),
                  );

                  try {
                    const data = JSON.parse(jsonContent);
                    if (data.keyInfo) {
                      const {key, geo} = data.keyInfo;
                      if (geo && geo.city) {
                        const location = [geo.city, geo.region]
                          .filter(Boolean)
                          .join(", ");
                        const flag = geo.country
                          ? String.fromCodePoint(
                            ...geo.country
                              .toUpperCase()
                              .split("")
                              .map((c) => c.charCodeAt(0) + 127397),
                          )
                          : "🌎";
                        const text = `${keyNames[key]} from ${flag} ${location}`;

                        // Update key info display
                        keyInfo.textContent = text;
                        keyInfo.classList.remove("visible");

                        // Force reflow
                        void keyInfo.offsetHeight;

                        // Show with animation
                        keyInfo.classList.add("visible");

                        // Clear previous timeout
                        clearTimeout(keyInfoTimeout);

                        // Hide after delay
                        keyInfoTimeout = setTimeout(() => {
                          keyInfo.classList.remove("visible");
                        }, 2000);
                      }
                    }
                  } catch (e) {
                    console.error("Error parsing JSON:", e);
                  }
                }

                // Move to next frame or end
                frameStart = nextFrame !== -1 ? nextFrame + 2 : buffer.length;
              }
            }
          }

          // Keep only unprocessed data
          buffer = buffer.slice(frameStart);
        }

        // Clear current stream reference
        currentStream = null;

        // Only start a new stream if page is visible
        if (!document.hidden) {
          startStream();
        }
      } catch (err) {
        console.error("Error streaming frames:", err);

        // Clear current stream reference
        currentStream = null;

        // Only retry if page is visible
        if (!document.hidden) {
          // Exponential backoff with jitter
          const delay = Math.min(
            Math.pow(2, retryCount) * 1000 + Math.random() * 1000,
            MAX_RETRY_DELAY,
          );
          retryCount++;
          setTimeout(startStream, delay);
        }
      }
    }

    // Helper function to find byte sequence in buffer
    function findSequence(buffer, sequence, start = 0) {
      for (let i = start; i <= buffer.length - sequence.length; i++) {
        let found = true;
        for (let j = 0; j < sequence.length; j++) {
          if (buffer[i + j] !== sequence[j]) {
            found = false;
            break;
          }
        }
        if (found) return i;
      }
      return -1;
    }

    // Key event handlers
    window.addEventListener("keydown", (e) => {
      if (e.repeat) return;
      const key = keyMap[e.key];
      if (key !== undefined) {
        e.preventDefault();
        pressKey(key);
      }
    });

    window.addEventListener("keyup", (e) => {
      const key = keyMap[e.key];
      if (key !== undefined) {
        e.preventDefault();
        releaseKey();
      }
    });

    // Button event handlers
    document.addEventListener("mousedown", (e) => {
      if (e.target.nodeName === "BUTTON") {
        e.preventDefault();
        pressKey(e.target.value);
      }
    });

    document.addEventListener("mouseup", (e) => {
      if (e.target.nodeName === "BUTTON") {
        e.preventDefault();
        releaseKey();
      }
    });

    // Touch event handlers
    document.addEventListener("touchstart", (e) => {
      if (e.target.nodeName === "BUTTON") {
        e.preventDefault();
        pressKey(e.target.value);
      }
    });

    document.addEventListener("touchend", (e) => {
      if (e.target.nodeName === "BUTTON") {
        e.preventDefault();
        releaseKey();
      }
    });

    // Visibility handling
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        releaseKey();
        // Let current stream finish naturally
      } else {
        // Only start a new stream if we don't have one running
        if (!currentStream) {
          startStream();
        }
      }
    });

    // Start the stream
    startStream();
  </script>
</body>

</html>
